<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FORGE Gateway</title>
<style>
  :root {
    --bg:#0f1115; --panel:#171a21; --panel2:#1d212b; --line:#262b36;
    --text:#e6e9ef; --dim:#8b93a3; --accent:#5db0ff; --good:#4ade80;
    --warn:#fbbf24; --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; background:var(--bg); color:var(--text);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  header {
    padding:20px 28px; border-bottom:1px solid var(--line);
    display:flex; align-items:baseline; gap:14px;
  }
  header h1 { margin:0; font-size:18px; letter-spacing:.02em; }
  header .sub { color:var(--dim); font-size:13px; }
  header .live { margin-left:auto; color:var(--dim); font-size:12px; }
  header .dot { color:var(--good); }
  main { padding:24px 28px; max-width:1100px; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:14px; }
  .card {
    background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px 18px;
  }
  .card .label { color:var(--dim); font-size:12px; text-transform:uppercase; letter-spacing:.05em; }
  .card .value { font-size:26px; font-weight:600; margin-top:6px; font-variant-numeric:tabular-nums; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--dim);
       margin:30px 0 12px; }
  table { width:100%; border-collapse:collapse; background:var(--panel); border-radius:10px; overflow:hidden; }
  th, td { text-align:left; padding:10px 14px; border-bottom:1px solid var(--line); font-variant-numeric:tabular-nums; }
  th { color:var(--dim); font-weight:500; font-size:12px; text-transform:uppercase; letter-spacing:.04em; }
  td.num, th.num { text-align:right; }
  tr:last-child td { border-bottom:none; }
  .mono { font-family:var(--mono); font-size:12.5px; }
  .tag { padding:1px 8px; border-radius:20px; font-size:11px; font-family:var(--mono); }
  .tag.HIT,.tag.SEMANTIC { background:rgba(74,222,128,.14); color:var(--good); }
  .tag.MISS,.tag.STREAM,.tag.BYPASS { background:rgba(139,147,163,.16); color:var(--dim); }
  .wrap { overflow-x:auto; }
  .empty { color:var(--dim); padding:18px 0; }
</style>
</head>
<body>
<header>
  <h1>FORGE Gateway</h1>
  <span class="sub">metrics from the append-only ledger</span>
  <span class="live"><span class="dot">●</span> live · refreshing every 3s</span>
</header>
<main>
  <div class="cards" id="cards"></div>

  <h2>Spend by model</h2>
  <div class="wrap"><table id="models">
    <thead><tr><th>Model</th><th class="num">Requests</th><th class="num">Tokens</th><th class="num">Cost (USD)</th></tr></thead>
    <tbody></tbody>
  </table></div>

  <h2>Recent requests</h2>
  <div class="wrap"><table id="log">
    <thead><tr><th>Time</th><th>Client</th><th>Model</th><th class="num">Tokens</th>
      <th class="num">Cost</th><th class="num">Latency</th><th>Cache</th></tr></thead>
    <tbody></tbody>
  </table></div>
</main>

<script>
const $ = s => document.querySelector(s);
const fmt$ = n => "$" + (n < 0.01 ? n.toFixed(6) : n.toFixed(4));
const pct = n => (n * 100).toFixed(1) + "%";
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function card(label, value) {
  return `<div class="card"><div class="label">${label}</div><div class="value">${value}</div></div>`;
}

async function tick() {
  let m, rows;
  try {
    m = await (await fetch("/v1/metrics")).json();
    rows = await (await fetch("/v1/ledger?limit=25")).json();
  } catch (e) { return; }   // gateway momentarily unreachable — keep last view

  $("#cards").innerHTML =
    card("Requests", m.total_requests) +
    card("Total cost", fmt$(m.total_cost)) +
    card("Cache hit rate", pct(m.cache_hit_rate)) +
    card("p95 latency", m.p95_latency_ms + " ms") +
    card("Total tokens", m.total_tokens.toLocaleString());

  const mb = $("#models tbody");
  mb.innerHTML = (m.by_model || []).map(r =>
    `<tr><td class="mono">${esc(r.model)}</td><td class="num">${r.requests}</td>
     <td class="num">${r.tokens.toLocaleString()}</td><td class="num">${fmt$(r.cost)}</td></tr>`
  ).join("") || `<tr><td colspan="4" class="empty">no requests yet</td></tr>`;

  const lb = $("#log tbody");
  lb.innerHTML = (rows || []).map(r => {
    const t = (r.ts || "").replace("T", " ").slice(0, 19);
    return `<tr><td class="mono">${esc(t)}</td><td class="mono">${esc(r.client_id)}</td>
      <td class="mono">${esc(r.model)}</td><td class="num">${r.total_tokens}</td>
      <td class="num">${fmt$(r.cost_usd)}</td><td class="num">${r.latency_ms} ms</td>
      <td><span class="tag ${esc(r.cache_status)}">${esc(r.cache_status)}</span></td></tr>`;
  }).join("") || `<tr><td colspan="7" class="empty">no requests yet</td></tr>`;
}

tick();
setInterval(tick, 3000);
</script>
</body>
</html>
